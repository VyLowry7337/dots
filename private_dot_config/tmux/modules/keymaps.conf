# =============================================================================
#  keybindings.conf — Prefix, Panes, Windows, Sessions
# =============================================================================

# --- Prefix Key ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix       # Press twice to send prefix to inner session

# --- Config Reload ---
bind C-r source-file ~/.config/tmux/tmux.conf \; display "  tmux.conf reloaded!"
bind C-e new-window -n "tmux-config" "nvim ~/.config/tmux/tmux.conf"

# =============================================================================
# PANE MANAGEMENT
# =============================================================================

# Split in current directory — v = vertical (like :vsplit), s = horizontal
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes — Vim h/j/k/l
# Works seamlessly with christoomey/vim-tmux-navigator in Neovim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes — uppercase, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fine resize with arrow keys (2 cells at a time)
bind -r Left  resize-pane -L 2
bind -r Down  resize-pane -D 2
bind -r Up    resize-pane -U 2
bind -r Right resize-pane -R 2

# Swap pane position with neighbour
bind > swap-pane -D
bind < swap-pane -U

# Toggle pane zoom / fullscreen
bind z resize-pane -Z

# Kill pane without confirmation prompt
bind x kill-pane

# Move pane into its own window
bind b break-pane -d

# Pull a pane in from another window: <prefix> @ then window number
bind @ command-prompt -p "Join pane from window:" "join-pane -s '%%'"

# Synchronise input across all panes (useful for parallel SSH sessions)
bind e setw synchronize-panes \; display "Sync panes: #{?synchronize-panes,ON,OFF}"

# =============================================================================
# WINDOW MANAGEMENT
# =============================================================================

# New window — opens in current directory
bind c new-window -c "#{pane_current_path}"

# Rename window / session
bind r command-prompt -I "#{window_name}"   "rename-window  '%%'"
bind R command-prompt -I "#{session_name}"  "rename-session '%%'"

# Navigate windows
bind -r n next-window
bind -r N previous-window
bind Tab last-window           # Toggle between last two windows

# Move window left / right in the tab bar
bind -r , swap-window -t -1 \; previous-window
bind -r . swap-window -t +1 \; next-window

# Jump to window by number
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Kill window / show chooser
bind X kill-window
bind W choose-window

# =============================================================================
# SESSION MANAGEMENT
# =============================================================================

bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind q confirm-before -p "Kill session #S? (y/n)" kill-session
bind ( switch-client -p    # Previous session
bind ) switch-client -n    # Next session
bind L switch-client -l    # Most-recent session
bind T choose-tree -Zs     # Full session/window/pane tree

# =============================================================================
#  copy-mode.conf — Vi Copy Mode
# =============================================================================

# Use vi keys in copy mode and the status-line command prompt
setw -g mode-keys vi
set  -g status-keys vi

# Enter copy mode with Escape (Vim-like)
bind [ copy-mode

# --- Selection ---
bind -T copy-mode-vi v   send-keys -X begin-selection       # Char select
bind -T copy-mode-vi V   send-keys -X select-line           # Line select
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle      # Block select

# --- Yank ---
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send-keys -X copy-end-of-line

# --- Motion shortcuts ---
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line

# --- Search ---
bind -T copy-mode-vi / command-prompt -i -p "(search down)" \
  "send -X search-forward-incremental '%%%'"
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" \
  "send -X search-backward-incremental '%%%'"

# --- Paste ---
bind p paste-buffer
bind P choose-buffer     # Pick from buffer history

# Keybinds & Settings
source-file ~/.config/tmux/options/keybinds.conf
source-file ~/.config/tmux/options/settings.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin "tmux-plugins/tmux-battery"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-online-status"
set -g @plugin "tmux-plugins/tmux-prefix-highlight"
set -g @plugin "tmux-plugins/tmux-urlview"
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
# source-file ~/.config/tmux/statusBars/chadmux.conf
# source-file ~/.config/tmux/statusBars/dotbar.conf
# source-file ~/.config/tmux/statusBars/minimal.conf
# run-shell ~/.config/tmux/statusBars/onedark-block.conf
run-shell ~/.config/tmux/statusBars/onedark-compact.conf

# Window Namer
set -g @tmux_window_name_icon_style "'icon'"

# Pomodoro
set -g @pomodoro_on " "                      # The formatted output when the Pomodoro is running
set -g @pomodoro_complete " ✔︎"                 # The formatted output when the break is running
set -g @pomodoro_pause " ⏸︎"                    # The formatted output when the Pomodoro/break is paused
set -g @pomodoro_prompt_break " break?"      # The formatted output when waiting to start a break
set -g @pomodoro_prompt_pomodoro " start?"   # The formatted output when waiting to start a Pomodoro
set -g @pomodoro_granularity 'on'             # Enables MM:SS (ex: 00:10) format instead of the default (ex: 1m)
set -g @pomodoro_menu_position "L"

run '~/.config/tmux/plugins/tpm/tpm'
